name: Skills

on:
  workflow_dispatch:
  push:
    paths:
      - "skills/project-docs/**"
      - "skills/md-export/**"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/project-docs/**"
      - "skills/md-export/**"
      - ".github/workflows/skills.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regression:
    name: ${{ matrix.skill }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: project-docs
            with: --with markdown-it-py
          - skill: md-export
            with: --with python-docx --with pdfplumber
    defaults:
      run:
        working-directory: skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
      # md-export 的真实转换测试需要 Pandoc 3.9+、LibreOffice 和中文字体；缺工具时测试直接失败，不跳过
      - if: matrix.skill == 'md-export'
        uses: pandoc/actions/setup@v1.1.1
      - if: matrix.skill == 'md-export'
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libreoffice-writer fonts-noto-cjk
      - name: Regression
        env:
          MD_EXPORT_REQUIRE_TOOLS: ${{ matrix.skill == 'md-export' && '1' || '' }}
        run: uv run --no-project --python 3.12 ${{ matrix.with }} python -m unittest discover -s tests -v
