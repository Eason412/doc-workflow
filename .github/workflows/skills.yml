name: Skills

on:
  workflow_dispatch:
  push:
    paths:
      - "skills/**"
      - "tests/**"
      - "README.md"
      - "README.en.md"
      - "SETUP.md"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "tests/**"
      - "README.md"
      - "README.en.md"
      - "SETUP.md"
      - ".github/workflows/skills.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repository:
    name: Repository and docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Skill structure and standalone link checks
        run: uv run --no-project --python 3.12 python -m unittest discover -s tests -v
      - name: README and SETUP checks
        run: |
          uv run --no-project --python 3.12 skills/project-docs/scripts/check_readme.py --repo . --pair README.md README.en.md --require-tracked --json
          uv run --no-project --python 3.12 skills/project-docs/scripts/check_readme.py --repo . --file SETUP.md --require-tracked --json

  regression:
    name: ${{ matrix.skill }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: project-docs
            with: --with markdown-it-py
    defaults:
      run:
        working-directory: skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Regression
        run: uv run --no-project --python 3.12 ${{ matrix.with }} python -m unittest discover -s tests -v
