name: Skills

on:
  workflow_dispatch:
  push:
    paths:
      - "skills/doc-sync/**"
      - "skills/md-to-pdf/**"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "skills/doc-sync/**"
      - "skills/md-to-pdf/**"
      - ".github/workflows/skills.yml"

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  regression:
    name: ${{ matrix.skill }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: doc-sync
            with: markdown-it-py
          - skill: md-to-pdf
            with: pymupdf
    defaults:
      run:
        working-directory: skills/${{ matrix.skill }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
      # md-to-pdf 的真实转换测试需要 Pandoc 和中文字体；Chrome 由 runner 自带
      - if: matrix.skill == 'md-to-pdf'
        uses: pandoc/actions/setup@v1.1.1
      - if: matrix.skill == 'md-to-pdf'
        run: sudo apt-get update -q && sudo apt-get install -yq fonts-noto-cjk
      - name: Regression
        run: uv run --no-project --python 3.12 --with ${{ matrix.with }} python -m unittest discover -s tests -v
